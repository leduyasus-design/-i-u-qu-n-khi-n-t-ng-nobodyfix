<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Cờ Vua Pixel vs Bot - Thư mục KKK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .controls {
            margin-bottom: 20px;
            background: white;
            padding: 12px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select {
            padding: 8px 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            border: 2px solid #bdc3c7;
            outline: none;
            cursor: pointer;
            color: #34495e;
            background-color: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        #myBoard {
            width: 450px;
            max-width: 90vw;
            border: 4px solid #2c3e50;
            box-shadow: 8px 8px 0px #bdc3c7; 
            border-radius: 2px;
            overflow: hidden;
        }

        /* Giữ cho quân cờ Pixel sắc nét, không bị nhòe */
        .piece-417db {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform: scale(0.9); 
        }

        /* --- CSS VẼ CHẤM TRÒN GỢI Ý (Chuẩn 1/2 ô cờ) --- */
        .suggest-dot {
            position: relative;
        }
        .suggest-dot::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Kích thước chính xác bằng 50% (1/2) chiều rộng và chiều cao của ô cờ */
            width: 50%;
            height: 50%;
            background-color: rgba(0, 0, 0, 0.25); /* Màu đen trong suốt */
            border-radius: 50%;
            pointer-events: none; /* Tránh lỗi không thả được quân cờ */
            z-index: 2;
        }

        /* Vòng tròn khi có thể ăn quân đối phương */
        .suggest-capture {
            position: relative;
        }
        .suggest-capture::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; /* To hơn một chút để bao quanh quân địch */
            height: 80%;
            border: 4px solid rgba(231, 76, 60, 0.6); /* Viền đỏ */
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            box-sizing: border-box;
        }

        .status-box {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            min-height: 25px;
        }

        .btn-restart {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Điều quân khiển tướng 9C</h1>

    <div class="controls">
        <label for="difficulty"><strong>Chế độ Bot:</strong></label>
        <select id="difficulty">
            <option value="chill-chill">Dễ VL</option>
            <option value="chill-nhe">Thua là non</option>
            <option value="cang-thang">Không trình đừng chơi</option>
        </select>
    </div>

    <div class="container">
        <div id="myBoard"></div>
        <div class="status-box" id="status">Lượt của bạn (Trắng)</div>
        <button class="btn-restart" id="resetBtn">Ván Mới</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        let game = new Chess();
        let board = null;
        const $status = $('#status');
        const $difficulty = $('#difficulty');

        // Hàm xóa toàn bộ dấu chấm gợi ý
        function removeHighlights () {
            $('#myBoard .square-55d63').removeClass('suggest-dot suggest-capture');
        }

        // Hàm thêm dấu chấm gợi ý vào ô
        function highlightSquare (square, isCapture) {
            let $square = $('#myBoard .square-' + square);
            if (isCapture) {
                $square.addClass('suggest-capture');
            } else {
                $square.addClass('suggest-dot');
            }
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false; // Chỉ cho đi quân Trắng

            // Lấy danh sách nước đi hợp lệ
            let moves = game.moves({
                square: source,
                verbose: true
            });

            if (moves.length === 0) return;

            // Hiển thị gợi ý nước đi
            for (let i = 0; i < moves.length; i++) {
                let isCapture = moves[i].captured ? true : false;
                highlightSquare(moves[i].to, isCapture);
            }
        }

        function onDrop (source, target) {
            removeHighlights(); // Xóa gợi ý khi thả quân

            let move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });

            if (move === null) return 'snapback';

            updateStatus();
            window.setTimeout(makeBotMove, 500);
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        // --- BỘ NÃO CỦA BOT ---
        function makeBotMove() {
            if (game.game_over()) return;

            let possibleMoves = game.moves({ verbose: true });
            if (possibleMoves.length === 0) return;

            const level = $difficulty.val();
            let chosenMove = null;

            if (level === 'chill-chill') {
                if (Math.random() < 0.4) {
                    chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                } else {
                    chosenMove = getBestMoveByDepth(1);
                }
            } 
            else if (level === 'chill-nhe') {
                if (Math.random() < 0.15) {
                    chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                } else {
                    chosenMove = getBestMoveByDepth(2);
                }
            } 
            else if (level === 'cang-thang') {
                chosenMove = getBestMoveByDepth(3);
            }

            game.move({
                from: chosenMove.from,
                to: chosenMove.to,
                promotion: 'q'
            });

            board.position(game.fen());
            updateStatus();
        }

        function getBestMoveByDepth(depth) {
            let moves = game.moves({ verbose: true });
            moves.sort(() => 0.5 - Math.random());

            let bestMove = moves[0];
            let bestValue = Infinity; 

            for (let i = 0; i < moves.length; i++) {
                game.move(moves[i]);
                let value = minimax(depth - 1, -Infinity, Infinity, true); 
                game.undo();

                if (value < bestValue) {
                    bestValue = value;
                    bestMove = moves[i];
                }
            }
            return bestMove;
        }

        function minimax(depth, alpha, beta, isMaximizing) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board());
            }

            let moves = game.moves({ verbose: true });

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let score = minimax(depth - 1, alpha, beta, false);
                    game.undo();
                    maxEval = Math.max(maxEval, score);
                    alpha = Math.max(alpha, score);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let score = minimax(depth - 1, alpha, beta, true);
                    game.undo();
                    minEval = Math.min(minEval, score);
                    beta = Math.min(beta, score);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluateBoard(boardState) {
            let totalEvaluation = 0;
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    totalEvaluation += getPieceValue(boardState[i][j], i, j);
                }
            }
            return totalEvaluation;
        }

        function getPieceValue(piece, x, y) {
            if (piece === null) return 0;
            
            let value = 0;
            if (piece.type === 'p') value = 10;
            else if (piece.type === 'r') value = 50;
            else if (piece.type === 'n') value = 30;
            else if (piece.type === 'b') value = 30;
            else if (piece.type === 'q') value = 90;
            else if (piece.type === 'k') value = 9000;

            let centerBonus = 0;
            if (piece.type !== 'k') { 
                let distToCenterRow = Math.abs(x - 3.5);
                let distToCenterCol = Math.abs(y - 3.5);
                centerBonus = 4 - (distToCenterRow + distToCenterCol); 
            }

            let finalValue = value + centerBonus;
            return piece.color === 'w' ? finalValue : -finalValue;
        }

        function updateStatus () {
            let statusText = '';
            let moveColor = game.turn() === 'b' ? 'Đen (Bot)' : 'Trắng (Bạn)';

            if (game.in_checkmate()) {
                statusText = `Hết cờ! ${game.turn() === 'w' ? 'Bot Đen' : 'Bạn'} chiến thắng! 🎉`;
            }
            else if (game.in_draw()) {
                statusText = 'Trận đấu Hòa! 🤝';
            }
            else {
                statusText = `Đến lượt: ${moveColor}`;
                if (game.in_check()) {
                    statusText += ` - ĐANG BỊ CHIẾU TƯỚNG! ⚠️`;
                }
            }
            $status.html(statusText);
        }

        // --- CẤU HÌNH BÀN CỜ ---
        const config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            
            // Xóa chấm gợi ý nếu kéo chuột ra ngoài bàn cờ mà không thả
            onMouseoutSquare: removeHighlights, 
            
            pieceTheme: function(piece) {
                // Quân Trắng lấy ảnh pixel từ thư mục KKK
                if (piece.search(/^w/) !== -1) {
                    return piece + '.png'; 
                }
                // Quân Đen tự động lấy từ internet
                return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
            },
            
            darkSquare: '#769656',  // Ô tối
            lightSquare: '#eeeed2'  // Ô sáng
        };
        
        board = Chessboard('myBoard', config);

        // Reset game
        $('#resetBtn').on('click', () => {
            game.reset();
            board.start();
            removeHighlights();
            $status.html('Lượt của bạn (Trắng)');
        });

        // Chuyển chế độ khó
        $difficulty.on('change', () => {
            game.reset();
            board.start();
            removeHighlights();
            $status.html('Đã đổi chế độ. Lượt của bạn (Trắng)');
        });

    </script>
</body>
</html>
